name: Hexo Deploy

on:
  push:
    branches:
      - source

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: false # 我们之前已经确认改为 false
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # 使用最新的长期支持版
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        npm install strip-ansi@6.0.1 

    - name: Build Hexo
      run: |
        npx hexo clean
        npx hexo generate

    - name: Build Hexo
      run: |
        npx hexo clean
        npx hexo generate
        echo "--- Check generated files ---"
        ls -lh public/
        cat public/index.html | head -n 10

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.HEXO_DEPLOY_KEY }}
        publish_dir: ./public # 部署 generate 生成的目录
        publish_branch: main # 你的展示分支